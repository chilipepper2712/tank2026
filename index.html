<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#121309">
  <title>Tank 2026</title>
  <meta name="description" content="Tank 2026: bắn xe tăng góc nhìn từ trên xuống, phá hủy môi trường, chơi trên điện thoại nằm ngang và máy tính.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121309'/%3E%3Crect x='6' y='12' width='17' height='12' rx='2' fill='%23f0b23c'/%3E%3Crect x='10' y='9' width='9' height='7' rx='2' fill='%23c98f26'/%3E%3Crect x='18' y='11.5' width='10' height='2.5' fill='%23f0b23c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
  <script type="module" crossorigin src="./assets/index-CufQfm6Q.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/CanvasPool-D8bT_nmR.js">
  <link rel="modulepreload" crossorigin href="./assets/canvasUtils-uetfUNPf.js">
  <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-Cen4_nSo.js">
  <link rel="modulepreload" crossorigin href="./assets/BatchableSprite-Bi_K_O5q.js">
  <link rel="modulepreload" crossorigin href="./assets/Graphics-nYKiPWkb.js">
  <link rel="modulepreload" crossorigin href="./assets/getPo2TextureFromSource-C6vjFcVT.js">
  <link rel="modulepreload" crossorigin href="./assets/settings-DVM1srpd.js">
  <link rel="modulepreload" crossorigin href="./assets/UnitView-Bl549Ixc.js">
  <link rel="modulepreload" crossorigin href="./assets/RenderTexture-C86EArAK.js">
  <link rel="modulepreload" crossorigin href="./assets/Sfx-PTZBPH8l.js">
  <link rel="stylesheet" crossorigin href="./assets/index-C4zeGna5.css">
</head>
<body>
  <!-- HUD icons (24×24, stroke = currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-aim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-missile" viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><path d="M12 1.5c2.4 2.3 3 4.8 3 7.5v8H9V9c0-2.7.6-5.2 3-7.5z"/><path d="M9 12.5 6 17v2.5h3M15 12.5l3 4.5v2.5h-3M11 20l1 2.5 1-2.5"/></g></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M12 2.5c1 0 1.4 1.2 1.4 3V10l8.6 1.4v2L13.4 13v4.6l3.1 1.9v1.6L12 20.2l-4.5.9v-1.6l3.1-1.9V13L2 13.4v-2L10.6 10V5.5c0-1.8.4-3 1.4-3z"/><path d="M7.5 15.5h1.6M14.9 15.5h1.6"/></symbol>
    <symbol id="i-flare" viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 14 0z"/><path d="M5 9l7 7 7-7M12 9v7"/><circle cx="12" cy="18.5" r="2"/><path d="M8.5 21.5l1.2-1M15.5 21.5l-1.2-1"/></symbol>
    <symbol id="i-paper" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V3M5 4h13l-3 4.5 3 4.5H5"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9.5h4.5L21 13v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-tank" viewBox="0 0 24 24"><path d="M2.5 12.5h19v5.5h-19zM7 8.5h8v4H7zM15 10.5h7"/><path d="M5 18v1.5M9 18v1.5M13 18v1.5M17 18v1.5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></symbol>
    <symbol id="i-pc" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 1.8 20.5h20.4z"/><path d="M12 9.5v5M12 17.3v.4"/></symbol>
    <!-- menu and upgrade icons -->
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5.5c3-1.3 6-1.3 9 .5 3-1.8 6-1.8 9-.5v13c-3-1.3-6-1.3-9 .5-3-1.8-6-1.8-9-.5zM12 6v13"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 13l6-6 6 6M6 19l6-6 6 6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 21h18M6 21v-7M11 21V8M16 21v-10M21 21V4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-cannon" viewBox="0 0 24 24"><path d="M3 15h10v5H3zM6 11h6v4H6zM12 12.5h10"/></symbol>
    <symbol id="i-mg" viewBox="0 0 24 24"><path d="M3 14h13l3-2h2M5 14v4M9 14v3M13 14v-3h3"/><path d="M17 8.5v.01M19.5 7v.01M22 5.5v.01"/></symbol>
    <symbol id="i-cage" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 10h18M3 14h18M8 6v12M13 6v12M18 6v12"/></symbol>
    <symbol id="i-cagedrone" viewBox="0 0 24 24"><path d="M4 21V11l8-6 8 6v10M4 15h16M9 8v13M15 8v13"/><path d="M10 2.5h4M12 2.5V5"/></symbol>
    <symbol id="i-engine" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1" fill="currentColor"/></symbol>
    <symbol id="i-tracks" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="9" rx="4.5"/><circle cx="7" cy="12.5" r="1.6"/><circle cx="12" cy="12.5" r="1.6"/><circle cx="17" cy="12.5" r="1.6"/></symbol>
    <symbol id="i-stab" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-smoke" viewBox="0 0 24 24"><path d="M6 18a3.5 3.5 0 0 1 0-7 5 5 0 0 1 9.6-1.4A4 4 0 1 1 17 18z"/></symbol>
    <symbol id="i-drone" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></symbol>
    <symbol id="i-robot" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="7" rx="1.5"/><path d="M10 6.5h.01M14 6.5h.01M6 10h12v6H6zM8 16v5M16 16v5M18 12h4"/></symbol>
  </svg>

  <div id="game"></div>
  <!-- menu backdrop: security-camera views of the battlefield (src/splash.ts) -->
  <div id="splash" aria-hidden="true" hidden>
    <div class="sp-pic"></div>
    <div class="sp-veil"></div>
    <div class="sp-scan"></div>
    <div class="sp-roll"></div>
    <div class="sp-hud">
      <div class="sp-l"><span><b class="sp-rec" data-t="splash.rec"></b> <span class="sp-ver"></span></span><span class="sp-cam"></span></div>
      <div class="sp-r"><span class="sp-dtg"></span><span class="sp-pos"></span><span class="sp-scan-t"></span></div>
    </div>
    <div class="sp-black"></div>
  </div>

  <div id="hud" hidden>
    <div class="top">
      <div class="hp"><svg class="ic" data-t-aria="hud.armour"><use href="#i-shield"/></svg><div class="bars"><div class="bar"><i id="hpFill"></i></div><div class="bar plate" hidden><i id="plateFill"></i></div></div></div>
      <div id="objective"></div>
      <div class="right"><div id="fps"></div><button id="missionBtn" data-t-aria="hud.mission"><svg class="ic"><use href="#i-paper"/></svg></button><button id="pauseBtn" data-t-aria="hud.pause">II</button></div>
    </div>
    <div id="toast" hidden></div>
    <div id="flareTip" hidden data-t="hud.flareHint"></div>
    <div id="coach" hidden><div class="ch"><b id="coachStep"></b><strong id="coachTitle"></strong><button id="coachSkip" data-t="common.skipTraining"></button></div><p id="coachText"></p></div>
    <button id="misBtn" class="round small" data-t-aria="hud.missile"><svg class="ic"><use href="#i-missile"/></svg><b id="misAmmo" class="badge"></b><i id="misPips" class="pips"></i><span class="tip" data-t="hud.missileTip"></span></button>
    <button id="repBtn" class="round small" data-t-aria="hud.repair"><svg class="ic"><use href="#i-wrench"/></svg><b id="repKits" class="badge"></b><span class="tip" data-t="hud.repairTip"></span></button>
    <button id="fireBtn" class="round" data-state="idle" data-t-aria="hud.fire"><svg class="ic"><use href="#i-aim"/></svg><span class="tip" data-t="hud.fireTip"></span></button>
    <button id="flareBtn" class="round small" data-t-aria="hud.flare" hidden><svg class="ic"><use href="#i-flare"/></svg><b id="flareN" class="badge"></b><span class="tip" data-t="hud.flareTip"></span></button>
    <button id="airBtn" class="round small" data-t-aria="hud.air"><svg class="ic"><use href="#i-plane"/></svg><span class="tip" data-t="hud.airTip"></span></button>
    <div id="streak" hidden></div>
  </div>

  <section id="menu" class="screen">
    <h1 class="menu-logo"><img src="art/logo.png" data-t-alt="menu.title" alt=""></h1>
    <div id="levelRow" class="levels"></div>
    <p class="sub" id="levelInfo"></p>
    <div class="cards">
      <button class="card" data-class="tank">
        <strong data-t="class.tank"></strong>
        <em data-t="menu.tank.role"></em>
        <dl>
          <dt data-t="menu.stat.fire"></dt><dd><b style="--v:4"></b></dd>
          <dt data-t="menu.stat.armour"></dt><dd><b style="--v:4"></b></dd>
          <dt data-t="menu.stat.speed"></dt><dd><b style="--v:3"></b></dd>
        </dl>
        <small class="perm" data-perm="tank"></small>
      </button>
      <button class="card" data-class="apc">
        <strong data-t="class.apc"></strong>
        <em data-t="menu.apc.role"></em>
        <dl>
          <dt data-t="menu.stat.fire"></dt><dd><b style="--v:2"></b></dd>
          <dt data-t="menu.stat.armour"></dt><dd><b style="--v:2"></b></dd>
          <dt data-t="menu.stat.speed"></dt><dd><b style="--v:5"></b></dd>
        </dl>
        <small class="perm" data-perm="apc"></small>
      </button>
    </div>
    <nav class="row nav" data-t-aria="menu.nav">
      <button id="navStory" class="navbtn"><svg class="ic"><use href="#i-book"/></svg><span data-t="menu.navStory"></span></button>
      <button id="navUp" class="navbtn"><svg class="ic"><use href="#i-up"/></svg><span data-t="menu.navUp"></span></button>
      <button id="navCareer" class="navbtn"><svg class="ic"><use href="#i-chart"/></svg><span data-t="menu.navCareer"></span></button>
    </nav>
    <div class="hints">
      <p><b><svg class="ic"><use href="#i-phone"/></svg><span data-t="menu.hintPhone"></span></b><span data-t="menu.hintPhoneText"></span></p>
      <p><b><svg class="ic"><use href="#i-pc"/></svg><span data-t="menu.hintPc"></span></b><span data-t="menu.hintPcText"></span></p>
    </div>
    <div class="foot"><span></span><button id="unlockAll" class="link" data-t="menu.unlockAll" data-dev></button></div>
  </section>

  <section id="prep" class="screen" hidden>
    <h1 data-t="prep.title"></h1>
    <p class="sub" id="prepSub"></p>
    <div id="allyCards" class="cards"></div>
    <p class="sub" id="prepDroid"></p>
    <div class="row">
      <button id="goBtn" class="cta" data-t="prep.go"></button>
      <button id="backBtn" class="cta ghost" data-t="common.back"></button>
    </div>
  </section>

  <section id="brief" class="screen" hidden>
    <div class="bf-back" id="briefBg"></div>
    <figure class="bf-art">
      <div class="bf-pic" id="briefPic"><span class="bf-num" id="briefNum"></span>
        <svg class="bf-zoom" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <figcaption>
        <p class="sub" id="briefArea"></p>
        <h1 id="briefTitle"></h1>
      </figcaption>
    </figure>
    <div class="bf-text">
      <div class="bf-story" id="briefStory" hidden>
        <p class="bf-step" id="storyStep"></p>
        <p id="storyText"></p>
      </div>
      <dl class="brief">
        <dt data-t="brief.situation"></dt><dd id="bSit"></dd>
        <dt data-t="brief.task"></dt><dd id="bTask"></dd>
        <dt data-t="brief.lose"></dt><dd id="bLose"></dd>
        <dt id="bNoteT" data-t="brief.note"></dt><dd id="bNote"></dd>
        <dt id="bWeaT" data-t="brief.weather"></dt><dd id="bWea"></dd>
      </dl>
      <div class="row">
        <button id="storyNext" class="cta" hidden data-t="brief.storyNext"></button>
        <button id="storySkip" class="cta ghost" hidden data-t="brief.storySkip"></button>
        <button id="briefGo" class="cta" data-t="brief.go"></button>
        <button id="briefSkip" class="cta ghost" hidden data-t="common.skipTraining"></button>
        <button id="briefBack" class="cta ghost" data-t="common.back"></button>
      </div>
    </div>
  </section>

  <!-- the last level won: thanks for playing the demo -->
  <section id="demoEnd" class="screen" hidden>
    <div class="demo-box">
      <h1 data-t="demo.title"></h1>
      <p data-t="demo.text"></p>
      <div class="row">
        <button id="demoClose" class="cta" data-t="demo.close"></button>
        <button id="demoRestart" class="cta ghost" data-t="demo.restart"></button>
      </div>
      <p class="sub" data-t="demo.restartNote"></p>
    </div>
  </section>

  <section id="missionScr" class="screen" hidden>
    <h1 data-t="mission.title"></h1>
    <p class="sub" id="missionArea"></p>
    <dl class="brief">
      <dt data-t="brief.task"></dt><dd id="mTask"></dd>
      <dt data-t="brief.lose"></dt><dd id="mLose"></dd>
    </dl>
    <div class="row"><button id="missionClose" class="cta" data-t="mission.resume"></button></div>
  </section>

  <section id="settings" class="screen" hidden>
    <h1 data-t="set.title"></h1>
    <p class="sub" id="loadout"></p>
    <div class="set">
      <label for="sZoom"><span data-t="set.zoom"></span> <output id="oZoom"></output><input type="range" id="sZoom" min="0.6" max="1.3" step="0.05"></label>
      <label for="sLook"><span data-t="set.look"></span> <output id="oLook"></output><input type="range" id="sLook" min="0" max="0.5" step="0.05"></label>
      <label class="chk" for="sOff"><input type="checkbox" id="sOff"><span data-t="set.offscreen"></span></label>
      <label class="chk" for="sHit"><input type="checkbox" id="sHit"><span data-t="set.hitMarks"></span></label>
      <label class="chk" for="sRange"><input type="checkbox" id="sRange"><span data-t="set.ranges"></span></label>
      <label class="chk" for="sPix"><input type="checkbox" id="sPix"><span data-t="set.pixel"></span></label>
      <label for="sVol"><span data-t="set.volume"></span> <output id="oVol"></output><input type="range" id="sVol" min="0" max="1" step="0.05"></label>
      <label class="chk" for="sMute"><input type="checkbox" id="sMute"><span data-t="set.mute"></span></label>
      <label class="chk" for="sVox" data-dev><input type="checkbox" id="sVox"><span data-t="set.voxel"></span></label>
      <label class="chk" for="sLight"><input type="checkbox" id="sLight"><span data-t="set.lighting"></span></label>
      <label class="chk" for="sFps"><input type="checkbox" id="sFps"><span data-t="set.fps"></span></label>
      <label class="chk" for="sNew" data-dev><input type="checkbox" id="sNew"><span data-t="set.testNew"></span></label>
      <label for="sAi" data-dev><span data-t="set.ai"></span> <output id="oAi"></output><input type="range" id="sAi" min="0" max="3" step="1"></label>
      <label class="chk" for="sDbg" data-dev><input type="checkbox" id="sDbg"><span data-t="set.touchDebug"></span></label>
    </div>
    <div class="row">
      <button id="resumeBtn" class="cta" data-t="set.resume"></button>
      <button id="restartBtn" class="cta ghost" data-t="common.again"></button>
      <button id="quitBtn" class="cta ghost" data-t="set.quit"></button>
      <button id="resetBtn" class="cta ghost" data-t="set.reset"></button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <h1 id="resultTitle"></h1>
    <p class="sub" id="resultSub"></p>
    <div id="resultStats" class="rstats"></div>
    <p class="sub" id="keepNote"></p>
    <div id="choices"></div>
    <div class="row" id="resultActions">
      <button id="nextBtn" class="cta" hidden data-t="result.next"></button>
      <button id="againBtn" class="cta" data-t="common.again"></button>
      <button id="menuBtn" class="cta ghost" data-t="result.menu"></button>
    </div>
  </section>

  <!-- campaign story: one comic card per level (content in src/story.ts) -->
  <section id="story" class="screen sheet" hidden>
    <header class="sheet-head"><button class="back" data-back data-t-aria="common.back">‹</button><h1 data-t="story.title"></h1><span class="sub" id="storySub"></span></header>
    <div id="storyCards" class="story"></div>
  </section>

  <!-- upgrade overview per class, plus companions -->
  <section id="upgradesScr" class="screen sheet" hidden>
    <header class="sheet-head"><button class="back" data-back data-t-aria="common.back">‹</button><h1 data-t="guide.title"></h1>
    </header>
    <div id="guide"></div>
    <section class="gsec" id="gdUp">
      <div class="gsec-head"><h2 class="sec" data-t="up.section"></h2>
        <div class="tabs" role="tablist"><button role="tab" data-tab="tank" data-t="class.tank"></button><button role="tab" data-tab="apc" data-t="class.apc"></button></div></div>
      <p class="glead" id="upSub"></p>
      <div id="upGrid" class="upgrid"></div>
      <h3 class="gsub" data-t="up.allies"></h3>
      <div id="allyGrid" class="allygrid"></div>
    </section>
    <div id="guideEnd"></div>
  </section>

  <!-- career record -->
  <section id="career" class="screen sheet" hidden>
    <header class="sheet-head"><button class="back" data-back data-t-aria="common.back">‹</button><h1 data-t="career.title"></h1></header>
    <div id="careerTop" class="ctop"></div>
    <div id="careerGrid" class="cgrid"></div>
    <div class="row cfoot"><button id="freshStart" class="cta ghost" data-t="career.fresh"></button><button id="resetCareer" class="link" data-t="career.reset"></button></div>
  </section>

  <!-- a yes/no question (src/ask.ts) -->
  <section id="ask" class="screen" hidden>
    <div class="demo-box">
      <p id="askText"></p>
      <div class="row"><button id="askYes" class="cta"></button><button id="askNo" class="cta ghost"></button></div>
    </div>
  </section>

  <!-- title: the logo over the camera views, until the first tap (which also lets the browser play sound) -->
  <section id="title" hidden>
    <img class="title-logo" src="art/logo.png" data-t-alt="menu.title" alt="">
    <p class="title-tap" data-t="title.tap"></p>
  </section>

  <div id="rotate" hidden>
    <strong data-t="rotate.title"></strong>
    <span data-t="rotate.text"></span>
  </div>

</body>
</html>
